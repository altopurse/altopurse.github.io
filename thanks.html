<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order — TUMANIC M·A·E</title>
<meta name="theme-color" content="#0A0A0C">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230A0A0C'/%3E%3Cpath d='M12 3.5 13.7 9.06 19.36 7.75 15.4 12 19.36 16.25 13.7 14.94 12 20.5 10.3 14.94 4.64 16.25 8.6 12 4.64 7.75 10.3 9.06Z' fill='%23F2C400'/%3E%3C/svg%3E">
<style>
  .receipt { display: grid; place-content: center; min-height: 100svh; padding: var(--pad); }
  .receipt__inner { width: min(34rem, 100%); }
  .receipt__title {
    margin: 0 0 1rem;
    font-family: var(--display);
    font-variation-settings: 'wdth' 125;
    font-weight: 900;
    font-size: clamp(2rem, 7vw, 3.25rem);
    line-height: 0.95;
    text-transform: uppercase;
    text-wrap: balance;
  }
  .receipt__body { margin: 0 0 1.5rem; color: var(--muted); }
  .receipt__ref {
    margin: 0 0 2rem;
    padding: 0.9rem 1rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg-2);
    font-family: var(--mono);
    font-size: 0.82rem;
    overflow-wrap: anywhere;
  }
  .receipt__ref dt { color: var(--muted); }
  .receipt__ref dd { margin: 0.15rem 0 0.9rem; font-variant-numeric: tabular-nums; }
  .receipt__ref dd:last-of-type { margin-bottom: 0; }
</style>
</head>
<body>
<main class="receipt chapter--art">
  <div class="receipt__inner">
    <p class="eyebrow" id="state">Checking your payment…</p>
    <h1 class="receipt__title" id="head">One moment</h1>
    <p class="receipt__body" id="body">Asking the payment provider what happened. This takes a second or two.</p>

    <dl class="receipt__ref" id="ref" hidden>
      <dt>Item</dt><dd id="ref-item">—</dd>
      <dt>Amount</dt><dd id="ref-amount">—</dd>
      <dt>Reference</dt><dd id="ref-id">—</dd>
    </dl>

    <a class="btn btn--ghost" href="./">Back to the site</a>
  </div>
</main>

<script src="assets/js/config.js"></script>
<script type="module">
  const CFG = window.TUMANIC_CONFIG ?? {};
  const API = (CFG.apiBase ?? '').replace(/\/$/, '');
  const money = new Intl.NumberFormat(CFG.locale ?? 'en-GB', {
    style: 'currency', currency: CFG.currency ?? 'GBP',
    minimumFractionDigits: 0, maximumFractionDigits: 2
  });

  const $ = (s) => document.querySelector(s);
  const orderId = new URLSearchParams(location.search).get('order');

  const say = (state, head, body) => {
    $('#state').textContent = state;
    $('#head').textContent = head;
    $('#body').textContent = body;
  };

  if (!orderId) {
    say('Nothing to show', 'No order here',
        'This page only means something after a checkout. Head back to the site.');
  } else if (!API) {
    say('Not connected', 'Cannot check that',
        'The shop is not connected to its server, so this order cannot be looked up.');
  } else {
    try {
      const res = await fetch(`${API}/api/orders/${encodeURIComponent(orderId)}`);
      if (!res.ok) throw new Error('lookup failed');
      const order = await res.json();

      $('#ref').hidden = false;
      $('#ref-item').textContent = order.description ?? '—';
      $('#ref-amount').textContent = Number.isFinite(order.amountMinor)
        ? money.format(order.amountMinor / 100) : '—';
      $('#ref-id').textContent = order.id;

      if (order.status === 'paid') {
        say('Paid', 'Thank you',
            'That has gone through. A receipt is on its way to your inbox, and you will get a tracking number once it is posted.');
      } else if (order.status === 'pending' || order.status === 'open') {
        say('Still processing', 'Nearly there',
            'Your bank has not confirmed it yet. Keep this reference — if it does not clear within a few minutes, send it to the studio.');
      } else {
        say('Not completed', 'That did not go through',
            'Nothing has been charged. You can try again from the site, and nothing has been reserved in the meantime.');
      }
    } catch {
      say('Cannot reach the server', 'Unable to check right now',
          'Keep your reference from the Mollie confirmation email. If money left your account, the order went through — write to the studio and it will be sorted.');
    }
  }
</script>
</body>
</html>
